name: Backfill past TidyTuesday challenges

# Manual only. Builds posts for a range of past TidyTuesday weeks in a given
# year. "Week N" is the Nth weekly data folder published that year, in date
# order — the same numbering TidyTuesday's own per-year readme uses, not an
# ISO calendar week number.
#
# Note: this pipeline only understands the meta.yaml + per-dataset .md
# dictionary format TidyTuesday adopted in late 2025 (first seen the week of
# 2025-12-02). Earlier weeks use a different layout and will be skipped, not
# converted — check this run's log to see which requested weeks were
# actually built (see R/backfill.R).

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to backfill, e.g. 2024"
        required: true
        type: string
      start_week:
        description: "First week number to build (1 = earliest week of that year)"
        required: true
        type: string
        default: "1"
      end_week:
        description: "Last week number to build, inclusive. Leave blank to build just start_week."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tidytuesday-content
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Backfill selected weeks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TT_YEAR: ${{ inputs.year }}
          TT_START_WEEK: ${{ inputs.start_week }}
          TT_END_WEEK: ${{ inputs.end_week }}
        run: Rscript R/backfill.R

      - name: Commit and push backfilled posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            git commit -m "Backfill TidyTuesday posts: ${BACKFILL_SUMMARY:-$TT_YEAR}"
            git push
          fi
