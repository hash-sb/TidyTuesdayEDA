name: Backfill past TidyTuesday challenges

# Manual only. Builds a post for every upstream TidyTuesday week whose own
# published date falls within [start_date, end_date] — the dates you provide
# are just the window's edges, they don't need to land exactly on a week's
# folder date.
#
# Note: this pipeline only understands the meta.yaml + per-dataset .md
# dictionary format TidyTuesday adopted in late 2025 (first seen the week of
# 2025-12-02). Earlier weeks use a different layout and will be skipped, not
# converted — check this run's log to see which requested weeks were
# actually built (see R/backfill.R).
#
# Pushes made with the default GITHUB_TOKEN don't trigger other workflows'
# `push` events (GitHub disables that specifically to prevent recursive
# workflow chains), so publish.yml wouldn't actually fire on its own after
# this workflow's push -- it's explicitly dispatched instead.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill from this date, inclusive (YYYY-MM-DD, e.g. 2025-06-01)"
        required: true
        type: string
      end_date:
        description: "Backfill through this date, inclusive (YYYY-MM-DD). Leave blank to build just the single week covering start_date."
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tidytuesday-content
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Backfill selected date range
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TT_START_DATE: ${{ inputs.start_date }}
          TT_END_DATE: ${{ inputs.end_date }}
        run: Rscript R/backfill.R

      - name: Commit and push backfilled posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Backfill TidyTuesday posts: ${BACKFILL_SUMMARY:-$TT_START_DATE}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site publish
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
