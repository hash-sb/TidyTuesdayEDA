name: Check for new TidyTuesday challenge

# TidyTuesday is usually published on Monday, but drops can slip, so this
# polls regularly instead of relying on a once-a-week schedule. If a new
# week is found, R/check_and_build.R scaffolds posts/<date>/index.qmd and
# this workflow commits it straight to main. Pushes made with the default
# GITHUB_TOKEN don't trigger other workflows' `push` events (GitHub disables
# that specifically to prevent recursive workflow chains), so publish.yml
# wouldn't actually fire on its own -- this explicitly dispatches it instead.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: tidytuesday-content
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Check upstream and scaffold a post if there's a new week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript R/check_and_build.R

      - name: Commit and push new post
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new TidyTuesday post to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add TidyTuesday post for ${POST_DATE:-$(date -u +%F)}"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site publish
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
