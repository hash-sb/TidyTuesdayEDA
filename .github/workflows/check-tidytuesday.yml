name: Check for new TidyTuesday challenge

# TidyTuesday is usually published on Monday, but drops can slip, so this
# polls regularly instead of relying on a once-a-week schedule. If a new
# week is found, R/check_and_build.R scaffolds posts/<date>/index.qmd and
# this workflow commits it straight to main. That push is what triggers
# publish.yml to render and redeploy the site.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-tidytuesday
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Check upstream and scaffold a post if there's a new week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript R/check_and_build.R

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new TidyTuesday post to commit."
          else
            git commit -m "Add TidyTuesday post for ${POST_DATE:-$(date -u +%F)}"
            git push
          fi
